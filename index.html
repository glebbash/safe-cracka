<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#090b0c" />
    <link rel="icon" href="data:," />
    <title>Safe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="safe" aria-label="Safe dial game">
      <button id="settingsButton" class="settings-button" type="button" aria-label="Open settings" aria-haspopup="dialog"></button>
      <aside id="debugPanel" class="debug-panel" aria-live="polite">
        <div class="debug-numbers">
          <output id="cheatCurrent" class="cheat-current" aria-label="Current dial number">00</output>
          <output id="debugTarget" class="debug-target" aria-label="Target number">Target 00</output>
        </div>
        <div class="debug-copy">
          <div class="debug-row"><span id="debugStage"></span></div>
          <div id="debugState"></div>
        </div>
      </aside>
      <section id="dialShell" class="dial-shell" aria-label="Rotary safe dial">
        <div class="pointer"><span></span></div>
        <div id="dial" class="dial">
          <svg id="dialFace" viewBox="0 0 400 400" role="presentation"></svg>
        </div>
        <div class="hub"></div>
      </section>
    </main>
    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h1 id="settingsTitle">Settings</h1>
        <button id="settingsClose" class="settings-close" type="button" aria-label="Close settings"></button>
      </div>

      <form id="settingsForm" class="settings-form">
        <fieldset class="setting-group">
          <legend class="setting-title">Combination numbers</legend>
          <span class="setting-subtitle">Three-number mode ends right on 69. Four-number mode uses 5-4-3-2 passes, then ends left on 69.</span>
          <div class="segmented two-up" aria-label="Combination number count">
            <label><input type="radio" name="numberCount" value="3" /><span>3 numbers</span></label>
            <label><input type="radio" name="numberCount" value="4" /><span>4 numbers</span></label>
          </div>
        </fieldset>

        <label class="setting-row" for="vibrationSetting">
          <span class="setting-copy">
            <span class="setting-title">
              Vibration
              <button class="tooltip-trigger" type="button" aria-label="Vibration help" aria-describedby="vibrationTooltip">?</button>
              <span id="vibrationTooltip" class="tooltip" role="tooltip">Not supported on PC. On Android, enable touch feedback in your device's OS settings for it to work.</span>
            </span>
            <span class="setting-subtitle">Confirms ticks, targets, and unlocks with a vibration pulse.</span>
          </span>
          <span class="switch">
            <input id="vibrationSetting" name="vibration" type="checkbox" />
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>

        <label class="setting-row" for="soundSetting">
          <span class="setting-copy">
            <span class="setting-title">
              Sound
              <button class="tooltip-trigger" type="button" aria-label="Sound help" aria-describedby="soundTooltip">?</button>
              <span id="soundTooltip" class="tooltip" role="tooltip">Preferred on PC — it's the only supported feedback there. On Android, sound doesn't come through as well, so vibration is usually better.</span>
            </span>
            <span class="setting-subtitle">Confirms ticks, targets, and unlocks with a click sound.</span>
          </span>
          <span class="switch">
            <input id="soundSetting" name="sound" type="checkbox" />
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>

        <label class="setting-row" for="blinkSetting">
          <span class="setting-copy">
            <span class="setting-title">Indicator blink</span>
            <span class="setting-subtitle">Show the original target glow on the top triangle when a number is ready to lock.</span>
          </span>
          <span class="switch">
            <input id="blinkSetting" name="blink" type="checkbox" />
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>

        <label class="setting-row" for="cheatSetting">
          <span class="setting-copy">
            <span class="setting-title">Cheat mode</span>
            <span class="setting-subtitle">Show the current stage, direction, and target number.</span>
          </span>
          <span class="switch">
            <input id="cheatSetting" name="cheat" type="checkbox" />
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
